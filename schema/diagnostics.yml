---
name: diagnostics
reconfigureEndpoint: "" # Controller-wide reconfigure endpoint (can be overwritten)
resources:
  # diagnostics resources

  - name: Interface
    filename: interface
    readOnly: true
    endpoints:
      get: "/diagnostics/interface/getInterfaceConfig"
    getByFilter: true
    getAll: true
    attrs:
      - name: Device
        type: string
        key: device
      - name: Media
        type: string
        key: media
      - name: MediaRaw
        type: string
        key: media_raw
      - name: MacAddr
        type: string
        key: macaddr
      - name: IsPhysical
        type: bool
        key: is_physical
      - name: MTU
        type: string
        key: mtu
      - name: Status
        type: string
        key: status
      - name: Flags
        type: "[]string"
        key: flags
      - name: Capabilities
        type: "[]string"
        key: capabilities
      - name: Options
        type: "[]string"
        key: options
      - name: SupportedMedia
        type: "[]string"
        key: supported_media
      - name: Groups
        type: "[]string"
        key: groups
      - name: Ipv4
        type: "[]Ipv4Config"
        key: ipv4
      - name: Ipv6
        type: "[]Ipv6Config"
        key: ipv6
    customTypes:
      Ipv4Config:
        - name: IpAddr
          type: string
          key: ipaddr
        - name: SubnetBits
          type: int64
          key: subnetbits
        - name: Tunnel
          type: bool
          key: tunnel
      Ipv6Config:
        - name: IpAddr
          type: string
          key: ipaddr
        - name: SubnetBits
          type: int64
          key: subnetbits
        - name: Tunnel
          type: bool
          key: tunnel
        - name: Autoconf
          type: bool
          key: autoconf
        - name: Deprecated
          type: bool
          key: deprecated
        - name: LinkLocal
          type: bool
          key: "link-local"
        - name: Tentative
          type: bool
          key: tentative

rpc:
  - name: NetflowConfig
    filename: netflow_config
    customTypes:
      NetflowConfigMonad:
        - name: Monad
          type: NetflowConfig
          key: netflow
      NetflowConfigCapture:
        - name: CaptureInterfaces
          type: SelectedMapList
          key: interfaces
        - name: CaptureEgressOnly
          type: SelectedMapList
          key: egress_only
        - name: CaptureVersion
          type: SelectedMap
          key: version
        - name: CaptureTargets
          type: SelectedMapList
          key: targets
      NetflowConfigCollect:
        - name: CollectEnable
          type: string
          key: enable
      NetflowConfig:
        - name: Capture
          type: NetflowConfigCapture
          key: capture
        - name: Collect
          type: NetflowConfigCollect
          key: collect
        - name: ActiveTimeout
          type: string
          key: activeTimeout
        - name: InactiveTimeout
          type: string
          key: inactiveTimeout
      NetflowConfigSetResult:
        - name: Result
          type: string
          key: result
    rpc_calls:
      - name: Get
        method: GET
        endpoint: "/diagnostics/netflow/getconfig"
        result_type: NetflowConfigMonad
      - name: Set
        method: POST
        endpoint: "/diagnostics/netflow/setconfig"
        params:
          - name: netflow
            optional: false
            bodyParameter: true
            customType: NetflowConfig
        result_type: NetflowConfigSetResult
  - name: SystemHealthConfig
    filename: systemhealth_config
    customTypes:
      SystemHealthConfigMonad:
        - name: Monad
          type: SystemHealthConfig
          key: systemhealth
      SystemHealthConfig:
        - name: Enabled
          type: string
          key: enabled
      SystemHealthConfigSetResult:
        - name: Result
          type: string
          key: result
    rpc_calls:
      - name: Get
        method: GET
        endpoint: "/diagnostics/systemhealth/get"
        result_type: SystemHealthConfigMonad
      - name: Set
        method: POST
        endpoint: "/diagnostics/systemhealth/set"
        params:
          - name: systemhealth
            optional: false
            bodyParameter: true
            customType: SystemHealthConfig
        result_type: SystemHealthConfigSetResult
