---
name: core
resources:
  - name: Tunable
    filename: tunable
    monad: sysctl
    endpoints:
      add: "/core/tunables/addItem"
      get: "/core/tunables/getItem"
      update: "/core/tunables/setItem"
      delete: "/core/tunables/delItem"
      reconfigure: "/core/tunables/reconfigure"
    attrs:
      - name: Tunable
        type: string
        key: tunable
      - name: Value
        type: string
        key: value
      - name: Description
        type: string
        key: descr
rpc:
  - name: "System"
    filename: system
    customTypes: 
      SystemStatus:
        - name: CrashReporter
          type: Status
          key: CrashReporter   
        - name: Firewall
          type: Status
          key: Firewall   
        - name: System
          type: Status
          key: System   
      Status:
        - name: StatusCode
          type: int
          key: statusCode
        - name: Message
          type: string
          key: message
        - name: LogLocation
          type: string
          key: logLocation
        - name: Timestamp
          type: string
          key: timestamp
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: "Halt"
        method: "POST"
        endpoint: "/core/system/halt"
        result_type: "api.ActionResult"
      - name: "Reboot"
        method: "POST"
        endpoint: "/core/system/reboot"
        result_type: "api.ActionResult"
      - name: "Status"
        method: "GET"
        endpoint: "/core/system/status"
        result_type: "SystemStatus"
      - name: "DismissStatus"
        method: "POST"
        endpoint: "/core/system/dismiss_status"
        params:
          - name: "subject"
            optional: false
            bodyParameter: true
            type: string
        result_type: "api.ActionResult"  
  - name: "Service"
    filename: service
    customTypes:
      ServiceItem:
        - name: ID
          type: string
          key: id
        - name: Locked
          type: int
          key: locked
        - name: Running
          type: int
          key: running
        - name: Description
          type: string
          key: description
        - name: Name
          type: string
          key: name
      SearchServicesResponse:
        - name: Total
          type: int
          key: total
        - name: RowCount
          type: int
          key: rowCount
        - name: Current
          type: int
          key: current
        - name: Rows
          type: '[]ServiceItem'
          key: rows
      ServiceActionResult:
        - name: Result
          type: string
          key: result
    rpc_calls:
      - name: "Search"
        method: "POST"
        endpoint: "/core/service/search"
        result_type: "SearchServicesResponse"
      - name: "Start"
        method: "POST"
        endpoint: "/core/service/start"
        params:
          - name: "id"
            optional: false
            type: string
        result_type: "ServiceActionResult"
      - name: "Stop"
        method: "POST"
        endpoint: "/core/service/stop"
        params:
          - name: "id" # Path parameter
            optional: false
            type: string
        result_type: "ServiceActionResult"
      - name: "Restart"
        method: "POST"
        endpoint: "/core/service/restart"
        params:
          - name: "id"
            optional: false
            type: string
        result_type: "ServiceActionResult"
  - name: FirmwareSettings
    filename: firmware_settings
    customTypes:
      FirmwareSettingsMonad:
        - name: Monad
          type: FirmwareSettings
          key: firmware
      FirmwareSettings:
        - name: Mirror
          type: string
          key: mirror
        - name: Flavour
          type: string
          key: flavour
        - name: Type
          type: string
          key: type
        - name: Subscription
          type: string
          key: subscription
      FirmwareSettingsSetResult:
        - name: Result
          type: string
          key: result
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: Get
        method: GET
        endpoint: "/core/firmware/get"
        result_type: FirmwareSettingsMonad
      - name: Set
        method: POST
        endpoint: "/core/firmware/set"
        params:
          - name: firmware
            optional: false
            bodyParameter: true
            customType: FirmwareSettings
        result_type: FirmwareSettingsSetResult
  - name: Firmware
    filename: firmware
    customTypes:
      FirmwarePackage:
        - name: Name
          type: string
          key: name
        - name: Version
          type: string
          key: version
        - name: Comment
          type: string
          key: comment
        - name: Installed
          type: string
          key: installed
      FirmwareInfo:
        - name: Packages
          type: "[]FirmwarePackage"
          key: package
        - name: Plugins
          type: "[]FirmwarePackage"
          key: plugin
      FirmwareActionResult:
        - name: Status
          type: string
          key: status
        - name: MsgUUID
          type: string
          key: msg_uuid
      FirmwareStatus:
        - name: Status
          type: string
          key: status
        - name: Log
          type: string
          key: log
    rpc_calls:
      - name: Info
        method: GET
        endpoint: "/core/firmware/info"
        result_type: FirmwareInfo
      - name: Install
        method: POST
        endpoint: "/core/firmware/install"
        params:
          - name: pkg
        result_type: FirmwareActionResult
      - name: Remove
        method: POST
        endpoint: "/core/firmware/remove"
        params:
          - name: pkg
        result_type: FirmwareActionResult
      - name: Running
        method: GET
        endpoint: "/core/firmware/running"
        result_type: FirmwareStatus
      - name: UpgradeStatus
        method: GET
        endpoint: "/core/firmware/upgradestatus"
        result_type: FirmwareStatus
