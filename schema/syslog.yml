---
name: syslog
reconfigureEndpoint: "/syslog/service/reconfigure"
resources:
  - name: Destination
    filename: destination
    monad: destination
    endpoints:
      add: "/syslog/settings/addDestination"
      get: "/syslog/settings/getDestination"
      update: "/syslog/settings/setDestination"
      delete: "/syslog/settings/delDestination"
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Transport
        type: SelectedMap
        key: transport
      - name: Level
        type: SelectedMapList
        key: level
      - name: Facility
        type: SelectedMapList
        key: facility
      - name: Program
        type: SelectedMapList
        key: program
      - name: Hostname
        type: string
        key: hostname
      - name: Certificate
        type: SelectedMap
        key: certificate
      - name: Port
        type: string
        key: port
      - name: Rfc5424
        type: string
        key: rfc5424
      - name: Description
        type: string
        key: description

rpc:
  - name: SyslogConfig
    filename: syslog_config
    customTypes:
      SyslogConfigMonad:
        - name: Monad
          type: SyslogConfig
          key: syslog
      SyslogConfigGeneral:
        - name: Enabled
          type: string
          key: enabled
        - name: Loglocal
          type: string
          key: loglocal
        - name: Maxpreserve
          type: string
          key: maxpreserve
        - name: Maxfilesize
          type: string
          key: maxfilesize
      SyslogConfig:
        - name: General
          type: SyslogConfigGeneral
          key: general
      SyslogConfigSetResult:
        - name: Result
          type: string
          key: result
    rpc_calls:
      - name: Get
        method: GET
        endpoint: "/syslog/settings/get"
        result_type: SyslogConfigMonad
      - name: Set
        method: POST
        endpoint: "/syslog/settings/set"
        params:
          - name: syslog
            optional: false
            bodyParameter: true
            customType: SyslogConfig
        result_type: SyslogConfigSetResult
