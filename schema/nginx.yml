rpc:
  - name: Settings
    filename: settings
    customTypes:
      SettingsMonad:
        - name: Monad
          type: Settings
          key: nginx
      SettingsGeneral:
        - name: Enabled
          type: string
          key: enabled
        - name: BanTtl
          type: string
          key: ban_ttl
      SettingsHttp:
        - name: HttpWorkerProcesses
          type: string
          key: workerprocesses
        - name: HttpWorkerConnections
          type: string
          key: workerconnections
        - name: HttpSendfile
          type: string
          key: sendfile
        - name: HttpKeepaliveTimeout
          type: string
          key: keepalive_timeout
        - name: HttpResetTimedout
          type: string
          key: reset_timedout
        - name: HttpDefaultType
          type: string
          key: default_type
        - name: HttpServerNamesHashBucketSize
          type: string
          key: server_names_hash_bucket_size
        - name: HttpServerNamesHashMaxSize
          type: string
          key: server_names_hash_max_size
        - name: HttpVariablesHashMaxSize
          type: string
          key: variables_hash_max_size
        - name: HttpVariablesHashBucketSize
          type: string
          key: variables_hash_bucket_size
        - name: HttpBanResponse
          type: SelectedMap
          key: ban_response
        - name: HttpLogPermBan
          type: string
          key: log_perm_ban
        - name: HttpBotsUa
          type: SelectedMapList
          key: bots_ua
        - name: HttpHeadersMoreEnable
          type: string
          key: headers_more_enable
      SettingsWebgui:
        - name: WebguiLimitNetworks
          type: string
          key: limitnetworks
      Settings:
        - name: General
          type: SettingsGeneral
          key: general
        - name: Http
          type: SettingsHttp
          key: http
        - name: Webgui
          type: SettingsWebgui
          key: webgui
      SettingsSetResult:
        - name: Result
          type: string
          key: result
    rpc_calls:
      - name: Get
        method: GET
        endpoint: "/nginx/settings/get"
        result_type: SettingsMonad
      - name: Set
        method: POST
        endpoint: "/nginx/settings/set"
        params:
          - name: nginx
            optional: false
            bodyParameter: true
            customType: Settings
        result_type: SettingsSetResult
