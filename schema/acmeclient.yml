rpc:
  - name: Settings
    filename: settings
    customTypes:
      SettingsMonad:
        - name: Monad
          type: Settings
          key: acmeclient
      SettingsSettings:
        - name: Enabled
          type: string
          key: enabled
        - name: AutoRenewal
          type: string
          key: autoRenewal
        - name: UpdateCron
          type: SelectedMap
          key: UpdateCron
        - name: Environment
          type: SelectedMap
          key: environment
        - name: ChallengePort
          type: string
          key: challengePort
        - name: TlsChallengePort
          type: string
          key: TLSchallengePort
        - name: RestartTimeout
          type: string
          key: restartTimeout
        - name: HaproxyIntegration
          type: string
          key: haproxyIntegration
        - name: HaproxyAclRef
          type: SelectedMap
          key: haproxyAclRef
        - name: HaproxyActionRef
          type: SelectedMap
          key: haproxyActionRef
        - name: HaproxyServerRef
          type: SelectedMap
          key: haproxyServerRef
        - name: HaproxyBackendRef
          type: SelectedMap
          key: haproxyBackendRef
        - name: LogLevel
          type: SelectedMap
          key: logLevel
      Settings:
        - name: Settings
          type: SettingsSettings
          key: settings
      SettingsSetResult:
        - name: Result
          type: string
          key: result
    rpc_calls:
      - name: Get
        method: GET
        endpoint: "/acmeclient/settings/get"
        result_type: SettingsMonad
      - name: Set
        method: POST
        endpoint: "/acmeclient/settings/set"
        params:
          - name: acmeclient
            optional: false
            bodyParameter: true
            customType: Settings
        result_type: SettingsSetResult
